<div class="relative flex flex-col rounded-xl border border-blue-gray-50 bg-white text-gray-700 shadow-sm">
  <div class="flex items-start justify-between p-4">
    <div
      class="grid h-12 w-12 shrink-0 place-items-center rounded-xl text-xl text-white
             bg-gradient-to-br from-gray-900 to-gray-800 shadow-lg shadow-gray-900/20"
    >
      {{ icono }}
    </div>

    <div class="text-right">
      <p class="text-sm text-blue-gray-600">{{ titulo }}</p>
      <h4 class="text-2xl font-semibold text-blue-gray-900">{{ valor }}</h4>
    </div>
  </div>

  <div class="border-t border-blue-gray-50 p-4">
    <p class="text-sm text-blue-gray-600">{{ descripcion }}</p>
  </div>
</div>
