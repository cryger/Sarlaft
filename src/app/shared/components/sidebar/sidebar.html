<aside
  class="fixed inset-0 z-50 my-4 ml-4 flex h-[calc(100vh-32px)] w-72 flex-col
         rounded-xl bg-gradient-to-br from-gray-800 to-gray-900 text-white
         transition-transform duration-300 xl:translate-x-0"
  [class.translate-x-0]="open"
  [class.-translate-x-80]="!open"
>
  <!-- Marca -->
  <div class="border-b border-white/20">
    <a routerLink="/dashboard" (click)="cerrarMenu()" class="block px-8 py-6 text-center">
      <h6 class="text-base font-semibold text-white">SARLAFT</h6>
      <p class="mt-0.5 text-xs text-white/60">Sistema interno</p>
    </a>
  </div>

  <!-- Navegación -->
  <nav
    class="flex-1 overflow-y-auto p-4
           [scrollbar-width:thin] [scrollbar-color:rgba(255,255,255,0.2)_transparent]"
  >
    @for (seccion of secciones; track seccion.titulo) {
      <ul class="mb-3 flex flex-col gap-1">
        <li class="mx-3.5 mb-2 mt-4 first:mt-0">
          <p class="text-sm font-black uppercase text-white opacity-75">{{ seccion.titulo }}</p>
        </li>

        @for (item of seccion.items; track item.ruta) {
          <li>
            <a
              [routerLink]="destino(item)"
              routerLinkActive="bg-gradient-to-tr from-orange-600 to-orange-400 shadow-md shadow-orange-500/20"
              (click)="cerrarMenu()"
              class="flex w-full items-center gap-4 rounded-lg px-4 py-3 text-white
                     transition-all hover:bg-white/10 active:bg-white/30"
            >
              <span class="w-5 shrink-0 text-center text-lg leading-none">{{ item.icono }}</span>
              <span class="truncate text-base font-medium">{{ item.etiqueta }}</span>
            </a>
          </li>
        }
      </ul>
    }
  </nav>
</aside>
