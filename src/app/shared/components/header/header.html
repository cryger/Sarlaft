<nav class="w-full rounded-xl py-1">
  <div class="flex flex-col-reverse justify-between gap-6 md:flex-row md:items-center">
    <!-- Breadcrumb + título -->
    <div>
      <div class="mb-1 flex items-center text-sm">
        <a
          routerLink="/dashboard"
          class="text-blue-900 opacity-50 transition-all hover:text-blue-500 hover:opacity-100"
        >
          Inicio
        </a>
        <span class="mx-2 select-none text-gray-500">/</span>
        <span class="text-blue-gray-900">{{ titulo() }}</span>
      </div>
      <h6 class="text-base font-semibold text-gray-900">{{ titulo() }}</h6>
    </div>

    <!-- Herramientas -->
    <div class="flex items-center">
      <div class="mr-auto md:mr-4">
        <input
          type="search"
          placeholder="Buscar"
          class="h-12 w-full min-w-[200px] rounded-[7px] border border-blue-gray-200
                 bg-transparent px-3 text-sm text-gray-700 outline-none transition-all
                 placeholder:text-gray-500 focus:border-blue-gray-500 md:w-56"
        />
      </div>

      <button
        type="button"
        aria-label="Abrir menú"
        (click)="abrirMenu()"
        class="grid h-10 w-10 place-items-center rounded-lg text-xl text-gray-500 hover:bg-blue-gray-500/10 xl:hidden"
      >
        ☰
      </button>

      <span
        class="hidden items-center gap-1.5 rounded-lg px-4 py-3 text-xs font-bold uppercase text-gray-500 xl:flex"
        [title]="auth.usuario()?.rol ?? ''"
      >
        <span class="text-lg leading-none text-blue-gray-500">♙</span>
        {{ auth.usuario()?.nombre }}
      </span>

      <button
        type="button"
        aria-label="Notificaciones"
        class="relative grid h-10 w-10 place-items-center rounded-lg text-lg text-blue-gray-500
               hover:bg-blue-gray-500/10"
      >
        ♧
        <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-red-500"></span>
      </button>

      <button
        type="button"
        aria-label="Configuración"
        class="grid h-10 w-10 place-items-center rounded-lg text-lg text-blue-gray-500
               hover:bg-blue-gray-500/10"
      >
        ⚙
      </button>

      <button
        type="button"
        (click)="salir()"
        class="ml-1 rounded-lg px-3 py-2.5 text-xs font-bold uppercase text-gray-500
               hover:bg-blue-gray-500/10 hover:text-red-500"
      >
        Salir
      </button>
    </div>
  </div>
</nav>
